[theme]
# 選択時やアクセントになるメインカラー（落ち着いたセージグリーン）
primaryColor = "#698474"

# アプリ全体の背景色（真っ白ではなく、目に優しいウォームホワイト）
backgroundColor = "#F7F5F0"

# 入力枠やサイドバーの背景色（少し濃いめのベージュ）
secondaryBackgroundColor = "#EDE9DF"

# 文字色（真っ黒ではなく、少し柔らかいチャコールグレー）
textColor = "#333333"

# フォント（標準的で読みやすいゴシック体）
font = "sans serif"